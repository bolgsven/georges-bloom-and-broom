<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 116 105" role="img" aria-label="Silhouette of a gardener pushing a lawnmower">
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Walking gardener: a distinctly human silhouette including cap, head, body and legs. -->
    <path fill="#214734" d="M19 23c-1-6 4-11 11-11 6 0 10 4 10 9l7 2-2 3-8 1c-2 6-10 9-15 5-2-2-3-5-3-9Z"/>
    <path fill="#214734" d="M23 36c-5 2-7 10-8 19l12 9 17-6-2-12c-3-11-10-14-19-10Z"/>
    <path stroke="#214734" stroke-width="8.8" d="m22 57-3 18-9 14m19-28 12 11 5 19"/>
    <path stroke="#214734" stroke-width="7" d="m7 92 11 1m27 0 10 0"/>
    <path stroke="#214734" stroke-width="7.4" d="m37 47 16 10 9-2"/>
    <path stroke="#214734" stroke-width="4" d="m60 53 14 21 18-7"/>
    <!-- A small back hand gives the gardener a clear pushing pose. -->
    <ellipse fill="#214734" cx="61" cy="54" rx="4.2" ry="3.9"/>
    <!-- Mower frame and cutting deck -->
    <path fill="#78995b" d="M70 69h26c5 0 9 4 9 8v6H63l4-10c.6-2.5 1.4-4 3-4Z"/>
    <path fill="#214734" d="M79 62h10c3 0 5 2 5 5v2H73l2-5c.5-1.5 1.6-2 4-2Z"/>
    <path stroke="#214734" stroke-width="3.3" d="M66 82h41"/>
    <!-- Wheels are separate groups for subtle animated spin when scrolling. -->
    <g class="wheel wheel-back">
      <circle cx="74" cy="86" r="8.2" fill="#214734"/>
      <circle cx="74" cy="86" r="3.2" fill="#f5f7ef"/>
      <path stroke="#f5f7ef" stroke-width="1.3" d="M74 82v8M70 86h8"/>
    </g>
    <g class="wheel wheel-front">
      <circle cx="100" cy="86" r="8.2" fill="#214734"/>
      <circle cx="100" cy="86" r="3.2" fill="#f5f7ef"/>
      <path stroke="#f5f7ef" stroke-width="1.3" d="M100 82v8M96 86h8"/>
    </g>
    <path stroke="#476f4b" stroke-width="2.6" d="m108 76 5-4m-6 9 7-1"/>
  </g>
</svg>
